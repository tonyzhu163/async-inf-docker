# Builds the lerobot-smolvla eval/training image and publishes it to GHCR.
# Public repo => unlimited Actions minutes; public package => free storage and
# pulls. See README.md.

name: build-image

on:
  workflow_dispatch:
    inputs:
      lerobot_ref:
        description: LeRobot fork branch or tag to build against
        default: 8caf2c26322ae156d0aa733c65e8addeb626e138
  push:
    branches: [main, codex/blackwell-cu128]
    paths-ignore: [README.md]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # ~80% of this image is the CUDA stack torch bundles: ~15 GB final, ~18 GB
      # of layer storage while building. A stock runner has ~14 GB free, so the
      # build dies without this. Reclaims roughly 30 GB.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - id: release
        name: Read environment release
        run: |
          release="$(tr -d '[:space:]' < ENV_RELEASE)"
          case "$release" in
            legacy-cu121|forward-cu128) ;;
            *) echo "unsupported ENV_RELEASE: $release" >&2; exit 1 ;;
          esac
          echo "name=$release" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/async-inf-smolvla
          tags: |
            type=raw,value=${{ steps.release.outputs.name }}
            type=raw,value=latest,enable=${{ steps.release.outputs.name == 'forward-cu128' }}
            type=raw,value=blackwell,enable=${{ steps.release.outputs.name == 'forward-cu128' }}
            type=raw,value=cu128-{{date 'YYYYMMDD'}},enable=${{ steps.release.outputs.name == 'forward-cu128' }}
            type=raw,value=cu121-{{date 'YYYYMMDD'}},enable=${{ steps.release.outputs.name == 'legacy-cu121' }}
            type=sha,prefix=sha-

      # No gha build cache on purpose: the Actions cache is capped at 10 GB per
      # repo and these layers exceed that, so caching would thrash and evict
      # rather than help.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            LEROBOT_REF=${{ inputs.lerobot_ref || '8caf2c26322ae156d0aa733c65e8addeb626e138' }}

      # The image pins what matters but is not fully locked. Publish the actual
      # resolution as an artifact so it can be committed to the research repo
      # under requirements/.
      - name: Extract resolved lockfile
        run: |
          docker run --rm --entrypoint cat \
            "ghcr.io/${{ github.repository_owner }}/async-inf-smolvla:${{ steps.release.outputs.name }}" \
            /opt/lerobot-smolvla.lock > lerobot-smolvla-docker.lock
          wc -l lerobot-smolvla-docker.lock

      - uses: actions/upload-artifact@v4
        with:
          name: lerobot-smolvla-docker.lock
          path: lerobot-smolvla-docker.lock
