# Blackwell-capable LeRobot SmolVLA environment.
# Torch 2.7 is the first PyTorch release with Blackwell support; the cu128
# wheels also retain support for the RTX 4090s used by the existing vast setup.
name: lerobot-smolvla
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128
      - numpy==2.2.6
      - setuptools==80.10.2
      - fsspec==2026.2.0
      - json_numpy
