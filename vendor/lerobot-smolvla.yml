# Shared LeRobot/SmolVLA environment template for RTX 4090 and RTX 5090.
# Docker substitutes @TORCH_CUDA@ with cu126 or cu128; every other pin is
# identical across the two accelerator profiles.
name: lerobot-smolvla
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/@TORCH_CUDA@
      - torch==2.7.1+@TORCH_CUDA@
      - torchvision==0.22.1+@TORCH_CUDA@
      - torchaudio==2.7.1+@TORCH_CUDA@
      - numpy==2.2.6
      - setuptools==80.10.2
      - fsspec==2026.2.0
      - json_numpy
